environment: production
gcpSecrets:
  projectId: staysafe-auditz
  auth:
    secretRef:
      name: gcpsm-secret
      key: secret-access-credentials
externalSecrets:
  refreshInterval: 1h
  imagePull:
    remoteKey: GITHUB_CONTAINER_REGISTRY_CONFIG
    version: latest
ingress:
  # Set by the deployment environment. This placeholder must not be deployed.
  # Use a bare lowercase hostname without https://, a port, or a path.
  host: public-site.example.com
  # Additional bare lowercase hostnames, using the same format as host.
  additionalHosts: []
traefik:
  certResolver: le
app:
  replicaCount: 1
  image:
    repository: ghcr.io/stay-safe-auditz-software-limited/public-site
    # Updated on main by the release workflow after a tagged image is published.
    tag: "0.0.4"
    pullPolicy: IfNotPresent
  containerPort: 8080
  tmp:
    sizeLimit: 64Mi
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  health:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
