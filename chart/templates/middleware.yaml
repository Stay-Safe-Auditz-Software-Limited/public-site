apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "staysafePublicSite.fullname" . }}-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "staysafePublicSite.fullname" . }}-security-headers
spec:
  headers:
    customResponseHeaders:
      server: ""
      X-Powered-By: ""
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
{{- if and .Values.ingress.redirectToWww (kindIs "string" .Values.ingress.host) (not (hasPrefix "www." .Values.ingress.host)) }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "staysafePublicSite.fullname" . }}-www
spec:
  redirectRegex:
    regex: {{ printf "^https?://%s(?::[0-9]+)?/(.*)$" (regexQuoteMeta .Values.ingress.host) | quote }}
    replacement: {{ printf "https://www.%s/${1}" .Values.ingress.host | quote }}
    permanent: true
{{- end }}
