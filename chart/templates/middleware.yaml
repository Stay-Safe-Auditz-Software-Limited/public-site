apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "staysafePublicSite.fullname" . }}-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "staysafePublicSite.fullname" . }}-security-headers
spec:
  headers:
    customResponseHeaders:
      server: ""
      X-Powered-By: ""
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
