{{- $serviceName := include "staysafePublicSite.fullname" . }}
{{- $servicePort := .Values.app.service.port }}
{{- $tlsMiddleware := printf "%s-https" $serviceName }}
{{- $securityMiddleware := printf "%s-security-headers" $serviceName }}
{{- $wwwMiddleware := printf "%s-www" $serviceName }}
{{- $redirectToWww := and .Values.ingress.redirectToWww (kindIs "string" .Values.ingress.host) (not (hasPrefix "www." .Values.ingress.host)) }}
{{- $hosts := concat (list .Values.ingress.host) .Values.ingress.additionalHosts }}
{{- if $redirectToWww }}
{{- $hosts = append $hosts (printf "www.%s" .Values.ingress.host) }}
{{- end }}
{{- $hosts = uniq $hosts }}
{{- range $index, $host := $hosts }}
{{- $setting := "ingress.host" }}
{{- if gt $index 0 }}
{{- $setting = printf "ingress.additionalHosts[%d]" (sub $index 1) }}
{{- end }}
{{- if not (and (kindIs "string" $host) (le (len $host) 253) (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $host)) }}
{{- fail (printf "%s must be a bare lowercase DNS hostname, for example newweb.auditz.io, without http://, https://, a port, path, or Markdown link" $setting) }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ printf "%s-%s" $serviceName ($host | replace "." "-") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "staysafePublicSite.labels" $ | nindent 4 }}
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: {{ $.Values.traefik.certResolver }}
  routes:
    - kind: Rule
      match: Host(`{{ required "ingress.host must be set" $host }}`)
      middlewares:
        {{- if and $redirectToWww (eq $host $.Values.ingress.host) }}
        - name: {{ $wwwMiddleware }}
        {{- end }}
        - name: {{ $tlsMiddleware }}
        - name: {{ $securityMiddleware }}
      services:
        - name: {{ $serviceName }}
          port: {{ $servicePort }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ printf "%s-http" ($serviceName | trunc 58 | trimSuffix "-") }}
  labels:
    {{- include "staysafePublicSite.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    {{- range $host := $hosts }}
    - kind: Rule
      match: Host(`{{ $host }}`)
      middlewares:
        {{- if and $redirectToWww (eq $host $.Values.ingress.host) }}
        - name: {{ $wwwMiddleware }}
        {{- end }}
        - name: {{ $tlsMiddleware }}
        - name: {{ $securityMiddleware }}
      services:
        - name: {{ $serviceName }}
          port: {{ $servicePort }}
    {{- end }}
