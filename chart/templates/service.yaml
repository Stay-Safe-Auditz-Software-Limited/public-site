apiVersion: v1
kind: Service
metadata:
  name: {{ include "staysafePublicSite.fullname" . }}
  labels:
    {{- include "staysafePublicSite.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "staysafePublicSite.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.app.service.port }}
      targetPort: http
