name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nuxt:
    name: Nuxt quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Client/StaySafePublicSite
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Client/StaySafePublicSite/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

  helm:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint chart

      - name: Render chart
        run: helm template staysafe-public-site chart --set app.image.tag=ci

  publish:
    name: Build and publish container
    needs: [nuxt, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read image repository from chart
        id: image
        uses: mikefarah/yq@v4
        with:
          cmd: yq -er '.app.image.repository' chart/values.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: src/Client/StaySafePublicSite
          file: src/Client/StaySafePublicSite/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.result }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=public-site
          cache-to: type=gha,mode=max,scope=public-site

      - name: Record published image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.result }}
        run: |
          printf 'Published `%s:%s`\n\nDeploy with Helm value `app.image.tag=%s`.\n' \
            "$IMAGE_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
