name: Quality

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

jobs:
  nuxt:
    name: Nuxt quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Client/StaySafePublicSite
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Client/StaySafePublicSite/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

  helm:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint chart

      - name: Render chart
        run: helm template staysafe-public-site chart --set app.image.tag=ci

  publish:
    name: Build and publish container
    needs: [nuxt, helm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate image version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$GITHUB_REF_NAME" == latest ]]; then
            echo '::error::The Git tag must be a valid Docker image tag and must not be latest.'
            exit 1
          fi

      - name: Read image repository from chart
        id: image
        uses: mikefarah/yq@v4
        with:
          cmd: yq -er '.app.image.repository' chart/values.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: src/Client/StaySafePublicSite
          file: src/Client/StaySafePublicSite/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.result }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=public-site
          cache-to: type=gha,mode=max,scope=public-site

      - name: Record published image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.result }}
        run: |
          printf 'Published `%s:%s`\n\nDeploy with Helm value `app.image.tag=%s`.\n' \
            "$IMAGE_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  update-chart:
    name: Save published version in chart
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: public-site-chart-version
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image version
        uses: mikefarah/yq@v4
        with:
          cmd: yq -i '.app.image.tag = strenv(GITHUB_REF_NAME)' chart/values.yaml

      - name: Commit and push chart version
        run: |
          if git diff --quiet -- chart/values.yaml; then
            echo 'Chart already references this version.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chart/values.yaml
          git commit -m "Update public site image to $GITHUB_REF_NAME"
          git push origin HEAD:main
