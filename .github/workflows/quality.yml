name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nuxt:
    name: Nuxt quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Client/StaySafePublicSite
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Client/StaySafePublicSite/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

  helm:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint chart

      - name: Render chart
        run: helm template staysafe-public-site chart --set app.image.tag=ci
